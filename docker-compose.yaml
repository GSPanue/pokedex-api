services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - ${DB_PORT}:${DB_PORT}
    volumes:
      - db_data:/var/lib/postgresql/data

  server:
    image: node:20
    working_dir: /server
    volumes:
      - .:/server
      - server_data:/server_data
    command: sh bin/entrypoint.sh
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  db_data:
  server_data: